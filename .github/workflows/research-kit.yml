name: Verify public research kit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research_kit/requirements-ci.txt
      - name: Check public source, history and checksums
        run: python audit_release.py --manifest --history
      - name: Install only scoped contract-test dependencies
        run: python -m pip install --disable-pip-version-check -r research_kit/requirements-ci.txt
      - name: Check all reviewed research contracts
        run: python research_kit/run_checks.py
