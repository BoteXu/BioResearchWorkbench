name: Verify public release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python audit_release.py --history --manifest
      - run: python run_acceptance.py
  clean-windows-install:
    runs-on: windows-latest
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - name: Fresh core installation and MCP network smoke
        shell: pwsh
        run: |
          ./Install.ps1 -Profile core -Client portable -SkipRegistration -InstallDir (Join-Path $env:RUNNER_TEMP 'BiomniCore')
      - name: Confirm core profile stays lightweight
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'BiomniCore/.venv_tools/Scripts/python.exe'
          & $python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ['numpy','pandas','scipy','torch','langchain'])"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected scientific or model dependencies in core profile' }
      - name: Fixed public identity acceptance suite
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'BiomniCore/.venv_tools/Scripts/python.exe'
          & $python run_acceptance.py --network
          if ($LASTEXITCODE -ne 0) { throw 'Public identity acceptance failed' }
