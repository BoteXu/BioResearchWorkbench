name: Verify public release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-runtime-adapters:
    runs-on: ubuntu-latest
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165
        with:
          java-version: '21'
      - name: Install test-only upstream code tools in isolated CI
        run: python -m pip install nbclient nbformat ipykernel pydicom snakemake
      - name: Actual source/Notebook/metadata/workflow execution
        run: python tests/code_runtime_check.py
  code-security:
    runs-on: ubuntu-latest
    needs: privacy-and-unit
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: python
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
  scientific-server-adapters:
    runs-on: ubuntu-latest
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install upstream methods only in isolated CI
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite','coloc','susieR','metafor','BiocManager','cmprsk'),repos='https://cloud.r-project.org')
          BiocManager::install('decoupleR',ask=FALSE,update=FALSE)
      - name: Actual methods and QC refusal fixtures
        run: Rscript tests/scientific_backend_check.R
      - name: Actual clinical models and QC refusals
        run: Rscript tests/clinical_backend_check.R
  privacy-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python audit_release.py --history --manifest
      - run: python run_acceptance.py
      - run: python install_skills.py --validate-only
      - run: python generate_catalog.py --check
  public-scientific-benchmarks:
    runs-on: ubuntu-latest
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install isolated licensed benchmark dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('BiocManager','jsonlite','digest'),repos='https://cloud.r-project.org')
          BiocManager::install(c('DESeq2','pasilla'),ask=FALSE,update=FALSE)
      - run: Rscript tests/public_benchmark_check.R
  browser-interface:
    runs-on: ubuntu-latest
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
  clean-platform-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - name: Validate platform wrapper
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File ./Install.ps1 -ValidateOnly
          else
            sh ./Install.sh --validate-only
          fi
      - name: Fresh core installation and MCP network smoke
        shell: bash
        run: |
          python install.py --profile core --client portable --skip-registration --install-skills --skills-dir "$RUNNER_TEMP/BiomniSkills" --install-dir "$RUNNER_TEMP/BiomniCore"
      - name: Installed workflow pack is discoverable and repeatable
        shell: bash
        run: |
          python install_skills.py --destination "$RUNNER_TEMP/BiomniSkills"
          python -c "import install_skills,os; from pathlib import Path; c=install_skills.validate_pack(); root=Path(os.environ['RUNNER_TEMP'])/'BiomniSkills'; assert len(list(root.glob('*/SKILL.md')))==len(c['skills'])"
      - name: Installed CADD audits generate bound reports and retain refusals
        shell: bash
        run: |
          python -c "import install,subprocess,os; subprocess.run([str(install.runtime_python(os.path.join(os.environ['RUNNER_TEMP'],'BiomniCore'))),'tests/cadd_process_check.py'],check=True)"
          python -c "import install,subprocess,os; subprocess.run([str(install.runtime_python(os.path.join(os.environ['RUNNER_TEMP'],'BiomniCore'))),'tests/molecular_process_check.py'],check=True)"
      - name: Confirm core profile stays lightweight
        shell: bash
        run: |
          python -c "import install,subprocess,os; subprocess.run([str(install.runtime_python(os.path.join(os.environ['RUNNER_TEMP'],'BiomniCore'))),'-c',\"import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ['numpy','pandas','scipy','torch','langchain'])\"],check=True)"
      - name: Fixed public identity acceptance suite
        shell: bash
        run: |
          python -c "import install,subprocess,os; subprocess.run([str(install.runtime_python(os.path.join(os.environ['RUNNER_TEMP'],'BiomniCore'))),'run_acceptance.py','--network'],check=True)"
  local-analysis-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    needs: privacy-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install missing R analysis backends in the CI environment
        shell: Rscript {0}
        run: |
          if (!requireNamespace('BiocManager',quietly=TRUE)) install.packages('BiocManager',repos='https://cloud.r-project.org')
          BiocManager::install(version='3.20',ask=FALSE)
          BiocManager::install(c('limma','edgeR'),ask=FALSE,update=FALSE)
      - run: python -m pip install uv
      - name: Fresh local profile and pinned Vina
        shell: bash
        run: |
          python install.py --profile local --client portable --skip-registration --install-vina --install-skills --skills-dir "$RUNNER_TEMP/BiomniLocalSkills" --install-dir "$RUNNER_TEMP/BiomniLocal"
      - name: Real optional backends on fixed synthetic data
        shell: bash
        run: |
          python tests/ci_analysis.py
